# Rust sürümü (v2.0 beta): rust-v* etiketi gönderilince derler ve Release'e yükler.
# Python sürümünün v* etiketleriyle karışmasın diye ayrı etiket kullanılır.
name: Rust Release

on:
  push:
    tags: ["rust-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Derle ve paketle
        shell: pwsh
        run: |
          cargo build -p gdpi-app --release --manifest-path rust/Cargo.toml
          ./fetch_windivert.ps1
          $d = "dist/GDPI"
          New-Item -ItemType Directory -Force $d, "$d/licenses" | Out-Null
          Copy-Item rust/target/release/gdpi.exe "$d/GDPI.exe"
          Copy-Item -Recurse windivert "$d/windivert"
          Copy-Item LICENSE, THIRD_PARTY.md $d
          Copy-Item licenses/* "$d/licenses" -Recurse
          Compress-Archive -Path $d -DestinationPath dist/GDPI-rust-windows.zip -Force
          (Get-FileHash dist/GDPI-rust-windows.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii dist/GDPI-rust-windows.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GDPI-rust-windows
          path: dist/GDPI-rust-windows.zip*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: true
          name: GDPI ${{ github.ref_name }} (Rust, deneme)
          make_latest: false
          body: |
            GDPI'ın Rust ile baştan yazılmış hali. Python sürümüyle aynı işi yapıyor ama çok daha küçük
            (tek bir exe, yaklaşık 8 MB) ve biraz daha hızlı. Henüz deneme aşamasında; sorunsuz kullanmak
            istersen en son Python sürümünü (v1.2.2) indir.

            Windows'ta **GDPI-rust-windows.zip**'i indir, bir klasöre çıkar, içindeki GDPI.exe'yi aç ve yönetici
            iznine "Evet" de. Linux'ta **GDPI-rust-linux.tar.gz**'i açıp `./gdpi` ile çalıştır.

            Python sürümüyle aynı anda açma, ikisi aynı paketleri yakalamaya çalışır. GoodbyeDPI da kapalı olmalı.
          files: dist/GDPI-rust-windows.zip*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Derle ve paketle
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libxkbcommon-x11-0 libgl1-mesa-dri libegl1
          cargo build -p gdpi-app --release --manifest-path rust/Cargo.toml
          mkdir -p dist/GDPI
          cp rust/target/release/gdpi dist/GDPI/gdpi
          cp -r LICENSE THIRD_PARTY.md licenses dist/GDPI/
          tar -C dist -czf dist/GDPI-rust-linux.tar.gz GDPI
          (cd dist && sha256sum GDPI-rust-linux.tar.gz | cut -d' ' -f1 > GDPI-rust-linux.tar.gz.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GDPI-rust-linux
          path: dist/GDPI-rust-linux.tar.gz*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: true
          name: GDPI ${{ github.ref_name }} (Rust, deneme)
          make_latest: false
          body: |
            GDPI'ın Rust ile baştan yazılmış hali. Python sürümüyle aynı işi yapıyor ama çok daha küçük
            (tek bir exe, yaklaşık 8 MB) ve biraz daha hızlı. Henüz deneme aşamasında; sorunsuz kullanmak
            istersen en son Python sürümünü (v1.2.2) indir.

            Windows'ta **GDPI-rust-windows.zip**'i indir, bir klasöre çıkar, içindeki GDPI.exe'yi aç ve yönetici
            iznine "Evet" de. Linux'ta **GDPI-rust-linux.tar.gz**'i açıp `./gdpi` ile çalıştır.

            Python sürümüyle aynı anda açma, ikisi aynı paketleri yakalamaya çalışır. GoodbyeDPI da kapalı olmalı.
          files: dist/GDPI-rust-linux.tar.gz*
