# Her gönderimde testler: Linux motoru (birim ve gerçek ağda uçtan uca), arayüz açılış testi, Windows öz testi, Android
name: Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nftables xvfb
          python -m pip install -r requirements.txt
      - name: Birim testleri
        run: python -m unittest discover -s tests -v
      - name: Uçtan uca (NFQUEUE, root)
        run: sudo env GDPI_E2E=1 "$(which python)" -m unittest tests.test_linux_engine -v
      - name: Arayüz açılış testi
        run: |
          set +e
          HOME=$RUNNER_TEMP xvfb-run -a timeout 10 python gdpi.py --no-elevate
          code=$?
          test $code -eq 124 || { echo "Arayüz erken kapandı ($code)"; cat $RUNNER_TEMP/.config/GDPI/hata.txt 2>/dev/null; exit 1; }

  windows-selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Öz test (WinDivert, gerçek ağ)
        shell: pwsh
        run: |
          python -m pip install -q -r requirements.txt
          ./fetch_windivert.ps1
          python gdpi.py --selftest --no-elevate
          $out = Get-Content "$env:APPDATA\GDPI\selftest.txt" -Raw
          $out
          if ($out -match "MOTOR BAŞLAMADI") { throw "Motor başlamadı" }

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: hev-socks5-tunnel kaynağı
        run: sh fetch_hev.sh
      - name: Birim testleri (SNI / Host ayrıştırma)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: APK derle
        run: ./gradlew --no-daemon assembleRelease
      - name: APK içinde yerel kütüphane var mı
        run: |
          unzip -l app/build/outputs/apk/release/app-release.apk | tee /dev/stderr | grep -q 'lib/arm64-v8a/libhev-socks5-tunnel.so'
      - uses: actions/upload-artifact@v4
        with:
          name: GDPI-android
          path: android/app/build/outputs/apk/release/app-release.apk
