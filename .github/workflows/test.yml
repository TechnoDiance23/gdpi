# Her gönderimde testler: lisans dosyaları + Linux motoru (birim ve gerçek ağda uçtan uca) + arayüz açılış testi
name: Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nftables xvfb
          python -m pip install -r requirements.txt
      - name: Birim testleri
        run: python -m unittest discover -s tests -v
      - name: Uçtan uca (NFQUEUE, root)
        run: sudo env GDPI_E2E=1 "$(which python)" -m unittest tests.test_linux_engine -v
      - name: Arayüz açılış testi
        run: |
          set +e
          HOME=$RUNNER_TEMP xvfb-run -a timeout 10 python gdpi.py --no-elevate
          code=$?
          test $code -eq 124 || { echo "Arayüz erken kapandı ($code)"; cat $RUNNER_TEMP/.config/GDPI/hata.txt 2>/dev/null; exit 1; }

  windows-selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Öz test (WinDivert, gerçek ağ)
        shell: pwsh
        run: |
          python -m pip install -q -r requirements.txt
          ./fetch_windivert.ps1
          python gdpi.py --selftest --no-elevate
          $out = Get-Content "$env:APPDATA\GDPI\selftest.txt" -Raw
          $out
          if ($out -match "MOTOR BAŞLAMADI") { throw "Motor başlamadı" }

  # ---------------------------------------------------------------- Rust (v2.0 beta)
  rust-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Bağımlılıklar
        run: sudo apt-get update -q && sudo apt-get install -y -q nftables xvfb curl RUST_APT_DEPS
      - name: Fark derlemi (Python gdpi.py ile beklenen sonuçlar)
        run: python -I gdpi-core/tests/gen_corpus.py
      - name: Birim + fark + proptest
        run: GDPI_REQUIRE_CORPUS=1 cargo test --workspace --release
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Uçtan uca (NFQUEUE, root)
        run: |
          cargo test -p gdpi-linux --release --test e2e --no-run
          bin=$(ls -t target/release/deps/e2e-* | grep -v '\.d$' | head -1)
          sudo env GDPI_E2E=1 "$bin" --nocapture
      - name: Arayüz açılış testi
        run: |
          cargo build -p gdpi-app --release
          set +e
          HOME=$RUNNER_TEMP xvfb-run -a timeout 10 target/release/gdpi --no-elevate
          code=$?
          test $code -eq 124 || { echo "Arayüz erken kapandı ($code)"; cat $RUNNER_TEMP/.config/GDPI/hata.txt 2>/dev/null; exit 1; }

  rust-windows-selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Derle
        run: cargo build -p gdpi-app --release --manifest-path rust/Cargo.toml
      - name: Testler
        run: cargo test --workspace --release --manifest-path rust/Cargo.toml
      - name: Öz test (WinDivert, gerçek ağ)
        shell: pwsh
        run: |
          ./fetch_windivert.ps1
          New-Item -ItemType Directory -Force t | Out-Null
          Copy-Item rust/target/release/gdpi.exe t/GDPI.exe
          Copy-Item -Recurse windivert t/windivert
          $p = Start-Process t/GDPI.exe -ArgumentList "--selftest","--no-elevate" -Wait -PassThru
          $out = Get-Content "$env:APPDATA\GDPI\selftest.txt" -Raw
          $out
          if ($out -match "MOTOR BAŞLAMADI") { throw "Motor başlamadı" }
          if ($out -notmatch "GDPI açık") { throw "Öz test eksik" }
