# v* etiketi gönderilince GDPI.exe'yi derler ve otomatik olarak GitHub Release'e yükler.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Derle
        run: ./build.ps1
        shell: pwsh
      - name: Lisans dosyalarını doğrula
        run: |
          foreach ($f in "LICENSE", "THIRD_PARTY.md", "licenses\MANIFEST.txt", "licenses\WinDivert-LICENSE.txt") {
            if (-not (Test-Path "dist\GDPI\$f")) { throw "Dağıtımda eksik: $f" }
          }
          Get-Content dist\GDPI\licenses\MANIFEST.txt
        shell: pwsh
      # LGPL/GPL bileşenlerinin (WinDivert, pystray) karşılık gelen kaynak kodu, ikili dosyayla
      # aynı yerden sunulur (GPLv3 md. 6(d), LGPLv3 md. 4). Bileşenler değiştirilmemiştir.
      - name: Üçüncü parti kaynak kodu
        run: |
          Invoke-WebRequest https://github.com/basil00/WinDivert/archive/refs/tags/v2.2.2.zip -OutFile dist/WinDivert-2.2.2-source.zip
          Invoke-WebRequest https://github.com/moses-palmer/pystray/archive/refs/tags/v0.19.5.zip -OutFile dist/pystray-0.19.5-source.zip
          Compress-Archive -Path dist/WinDivert-2.2.2-source.zip, dist/pystray-0.19.5-source.zip -DestinationPath dist/GDPI-third-party-sources.zip -Force
        shell: pwsh
      - name: SHA256
        run: |
          foreach ($f in "GDPI-windows.zip", "GDPI-third-party-sources.zip") {
            (Get-FileHash dist/$f -Algorithm SHA256).Hash | Out-File -Encoding ascii dist/$f.sha256
          }
        shell: pwsh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: GDPI-windows
          path: |
            dist/GDPI-windows.zip
            dist/GDPI-third-party-sources.zip
            dist/*.sha256
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: GDPI ${{ github.ref_name }}
          files: |
            dist/GDPI-windows.zip
            dist/GDPI-windows.zip.sha256
            dist/GDPI-third-party-sources.zip
            dist/GDPI-third-party-sources.zip.sha256
          body: |
            Windows'ta **GDPI-windows.zip**'i indir, bir klasöre çıkar ve içindeki **GDPI.exe**'yi aç.
            Yönetici iznine "Evet" de, ortadaki düğmeye bas, o kadar.

            Linux'ta **GDPI-linux.tar.gz**'i indir, açıp `./gdpi.sh` ile çalıştır. Önce gereken paketleri
            kurman lazım, README'de yazıyor.

            Exe imzasız olduğu için SmartScreen uyarı verebilir. "Ek bilgi" deyip "Yine de çalıştır"a basman
            yeterli. Dosyanın değişmediğinden emin olmak istersen SHA256 değerleri `.sha256` dosyalarında.

            GDPI'ın kendi kodu MIT lisanslı. İçinde kendi lisansı olan başka bileşenler de var (WinDivert ve
            pystray LGPLv3, ayrıntılar `THIRD_PARTY.md` dosyasında). Lisans metinleri zip içindeki `licenses/`
            klasöründe, LGPL bileşenlerinin kaynak kodu da `GDPI-third-party-sources.zip` içinde.

  # Linux: kaynak dosyalar + gdpi.sh tek bir tar.gz içinde (git archive, gdpi.sh çalıştırılabilir kalır)
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Paketle
        run: |
          mkdir -p dist
          git archive --format=tar --prefix=GDPI/ HEAD \
            gdpi.py gdpi.sh requirements.txt README.md LICENSE THIRD_PARTY.md licenses assets \
            | gzip -9 > dist/GDPI-linux.tar.gz
          tar -tzvf dist/GDPI-linux.tar.gz | grep -E 'gdpi\.(sh|py)$'
          (cd dist && sha256sum GDPI-linux.tar.gz | cut -d' ' -f1 > GDPI-linux.tar.gz.sha256)
      - name: Paketi dene (açılıp başlıyor mu)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q python3-venv python3-tk xvfb
          mkdir t && tar -xzf dist/GDPI-linux.tar.gz -C t && cd t/GDPI
          test -x gdpi.sh
          python3 -m venv .venv && .venv/bin/python -m pip install -q -r requirements.txt
          set +e; HOME=$RUNNER_TEMP xvfb-run -a timeout 10 .venv/bin/python gdpi.py --no-elevate; code=$?
          test $code -eq 124 || { echo "Arayüz erken kapandı ($code)"; exit 1; }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/GDPI-linux.tar.gz
            dist/GDPI-linux.tar.gz.sha256
